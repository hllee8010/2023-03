<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에듀케레 영수학원 분석지 | 2023-03-고2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2744;
    --gold: #c8a84b;
    --light-bg: #f4f6fb;
    --white: #ffffff;
    --border: #dde2ef;
    --text: #1e2340;
    --subtext: #5a6080;
    --green-bg: #e8f5e9;
    --green-text: #2e7d32;
    --yellow-bg: #fffde7;
    --yellow-text: #7f6000;
    --red: #c62828;
    --correct: #2e7d32;
    --wrong: #c62828;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--light-bg); color: var(--text); font-size: 14px; }

  /* ── HEADER ── */
  .site-header {
    background: var(--navy);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .site-header .brand { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 18px; }
  .site-header .subtitle { color: #8fa0c0; font-size: 12px; margin-top: 2px; }
  .site-header .badge { background: var(--gold); color: var(--navy); font-weight: 700; padding: 4px 12px; border-radius: 20px; font-size: 12px; }

  /* ── LAYOUT ── */
  .layout { display: flex; min-height: calc(100vh - 56px); }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px; min-width: 220px; background: var(--navy);
    padding: 20px 0; position: sticky; top: 56px; height: calc(100vh - 56px);
    overflow-y: auto;
  }
  .sidebar-title { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 0 18px 10px; text-transform: uppercase; }
  .passage-btn {
    display: block; width: 100%; text-align: left;
    padding: 10px 18px; border: none; background: none; cursor: pointer;
    color: #8fa0c0; font-family: 'Noto Sans KR', sans-serif; font-size: 13px;
    transition: all 0.2s; border-left: 3px solid transparent;
  }
  .passage-btn:hover { background: rgba(200,168,75,0.08); color: #fff; }
  .passage-btn.active { background: rgba(200,168,75,0.15); color: var(--gold); border-left-color: var(--gold); font-weight: 700; }
  .passage-btn .qnum { font-size: 11px; color: #5a6080; display: block; }

  /* ── MAIN ── */
  .main { flex: 1; padding: 28px; max-width: 900px; }

  /* ── PASSAGE HEADER ── */
  .passage-header {
    background: var(--navy); border-radius: 10px; padding: 20px 24px; margin-bottom: 20px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .passage-header .qno { color: var(--gold); font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .passage-header h2 { color: #fff; font-family: 'Playfair Display', serif; font-size: 20px; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: #fff; color: var(--subtext); font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .tab-btn:hover { border-color: var(--navy); color: var(--navy); }
  .tab-btn.active { background: var(--navy); color: var(--gold); border-color: var(--navy); font-weight: 700; }

  /* ── TAB PANELS ── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── FULL PASSAGE BOX ── */
  .full-passage {
    background: #fff; border: 2px solid var(--navy); border-radius: 8px;
    padding: 18px 20px; margin-bottom: 24px;
    font-family: 'EB Garamond', serif; font-size: 17px; line-height: 1.9;
    color: #1a1a2e;
  }

  /* ── SENTENCE ANALYSIS ── */
  .sentence-block { margin-bottom: 22px; }
  .sent-num { display: inline-block; background: var(--navy); color: var(--gold); border-radius: 50%; width: 24px; height: 24px; text-align: center; line-height: 24px; font-size: 12px; font-weight: 700; margin-right: 8px; }
  .eng-box {
    background: #fff; border: 1px solid #ccc; border-left: 4px solid #2E75B6;
    border-radius: 4px; padding: 10px 14px; margin: 8px 0 6px;
    font-family: 'EB Garamond', serif; font-size: 16px; line-height: 1.7;
  }
  .slash-reading { font-size: 13px; color: var(--subtext); margin: 4px 0 8px 4px; line-height: 1.6; }
  .slash-reading .kor { display: block; color: #333; margin-top: 2px; }
  .grammar-item { background: var(--yellow-bg); border-radius: 4px; padding: 7px 12px; margin: 4px 0; font-size: 13px; line-height: 1.6; }
  .grammar-item .g-name { color: var(--yellow-text); font-weight: 700; }
  .grammar-item .g-ex { color: #555; }
  .grammar-item .g-point { color: #7f3f00; font-style: italic; }

  /* ── VOCABULARY ── */
  .vocab-item { background: #fff; border-left: 4px solid #375623; padding: 10px 14px; margin: 6px 0; border-radius: 4px; font-size: 13px; }
  .vocab-item .vword { font-family: 'EB Garamond', serif; font-size: 15px; font-weight: 700; color: #1a2744; }
  .vocab-item .vmeta { color: var(--subtext); margin-left: 8px; }
  .vocab-item .vderiv { color: #375623; margin-left: 8px; font-size: 12px; }

  /* ── TRANSLATION ── */
  .translation-box { background: #fff; border-radius: 8px; padding: 20px; line-height: 2; font-size: 14px; border: 1px solid var(--border); }

  /* ── TOPIC/STRUCTURE ── */
  .topic-box { background: #fff; border-radius: 8px; padding: 20px; border: 1px solid var(--border); margin-bottom: 12px; }
  .topic-box h4 { color: var(--navy); font-size: 14px; font-weight: 700; margin-bottom: 8px; border-bottom: 2px solid var(--gold); padding-bottom: 6px; }
  .flow-step { display: flex; align-items: flex-start; gap: 10px; margin: 8px 0; }
  .flow-badge { background: var(--navy); color: var(--gold); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }

  /* ── QUIZ ── */
  .quiz-item { background: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; border: 1px solid var(--border); }
  .quiz-item h4 { color: var(--navy); font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .quiz-q { font-size: 14px; line-height: 1.8; margin: 10px 0; }
  .quiz-q .blank { background: #e8ecf8; border-bottom: 2px solid var(--navy); padding: 0 20px; border-radius: 3px; font-weight: 700; }
  .options { margin-top: 10px; }
  .opt-btn {
    display: block; width: 100%; text-align: left; padding: 8px 14px; margin: 5px 0;
    border: 1.5px solid var(--border); border-radius: 6px; background: #fff;
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--navy); background: #f0f3ff; }
  .opt-btn.correct { background: #e8f5e9; border-color: var(--correct); color: var(--correct); font-weight: 700; }
  .opt-btn.wrong { background: #ffebee; border-color: var(--wrong); color: var(--wrong); }
  .opt-btn.reveal { background: #e8f5e9; border-color: var(--correct); color: var(--correct); }
  .quiz-feedback { margin-top: 10px; padding: 8px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.ok { background: #e8f5e9; color: var(--correct); }
  .quiz-feedback.no { background: #ffebee; color: var(--wrong); }
  .reset-btn { margin-top: 8px; padding: 5px 14px; border: 1px solid var(--border); border-radius: 20px; background: #fff; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; cursor: pointer; color: var(--subtext); }
  .reset-btn:hover { border-color: var(--navy); color: var(--navy); }

  /* ── SHORT ANSWER ── */
  .short-answer-item { background: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; border: 1px solid var(--border); }
  .short-answer-item h4 { color: var(--navy); font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .condition-box { background: #f0f3ff; border-left: 3px solid var(--navy); padding: 7px 12px; font-size: 12px; color: var(--subtext); margin-bottom: 10px; border-radius: 3px; }
  .answer-textarea { width: 100%; min-height: 80px; border: 1.5px solid var(--border); border-radius: 6px; padding: 10px; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; resize: vertical; margin-top: 6px; }
  .answer-textarea:focus { outline: none; border-color: var(--navy); }
  .show-answer-btn { margin-top: 8px; padding: 6px 16px; background: var(--navy); color: #fff; border: none; border-radius: 20px; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; cursor: pointer; }
  .model-answer { display: none; margin-top: 10px; background: #e8f5e9; border-radius: 6px; padding: 10px 14px; font-size: 13px; color: var(--correct); }
  .model-answer.show { display: block; }

  /* ── ANSWER KEY ── */
  .answer-key { background: #fff; border-radius: 8px; padding: 20px; border: 1px solid var(--border); }
  .answer-key h4 { color: var(--navy); font-weight: 700; font-size: 15px; margin-bottom: 14px; border-bottom: 2px solid var(--gold); padding-bottom: 6px; }
  .ans-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .ans-no { background: var(--navy); color: var(--gold); font-weight: 700; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .ans-content { flex: 1; }
  .ans-correct { font-weight: 700; color: var(--navy); }
  .ans-exp { color: var(--subtext); margin-top: 2px; font-size: 12px; }

  .section-card { background: #fff; border-radius: 8px; border: 1px solid var(--border); padding: 18px 20px; margin-bottom: 14px; }
  .section-card h3 { color: var(--navy); font-size: 15px; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--gold); }

  highlight { background: #fff3cd; padding: 1px 3px; border-radius: 2px; font-weight: 700; }
  underline { text-decoration: underline; }
</style>
</head>

<header class="site-header">
  <div>
    <div class="brand">에듀케레 영수학원</div>

<div class="layout">

<script>
const passages = [

// ── 문항 21 ──────────────────────────────────────────────
{
  qnum: "문항 21",
  title: "완벽함이 선의 적이 되지 말게 하라",
  sentences: [
    {
      en: "Everyone's heard the expression don't let the perfect become the enemy of the good.",
      slash: "Everyone's heard / the expression / don't let the perfect / become the enemy of the good.",
      kor: "모든 사람은 들어봤다 / 그 표현을 / '완벽함이 / 선의 적이 되게 하지 마라'는.",
      grammar: [
        { name: "현재완료 수동적 의미의 현재완료", ex: "has heard → Everyone's heard (Everyone has heard)", point: "주어가 3인칭 단수일 때 has + p.p. 형태. 수능에서 현재완료와 단순과거 구별 출제." },
        { name: "사역동사 let + 목적어 + 동사원형", ex: "don't let the perfect become the enemy", point: "let은 목적격 보어로 동사원형을 취함. make, have, let 비교 빈출." }
      ]
    },
    {
      en: "If you want to get over an obstacle so that your idea can become the solution-based policy you've long dreamed of, you can't have an all-or-nothing mentality.",
      slash: "If you want / to get over an obstacle / so that your idea / can become the solution-based policy / you've long dreamed of, / you can't have / an all-or-nothing mentality.",
      kor: "만약 당신이 원한다면 / 장애물을 극복하기를 / 그래서 당신의 아이디어가 / 해결책 기반의 정책이 될 수 있도록 / 당신이 오랫동안 꿈꿔왔던, / 당신은 가질 수 없다 / 전부-아니면-전무의 사고방식을.",
      grammar: [
        { name: "목적의 부사절 so that + can", ex: "so that your idea can become the solution-based policy", point: "so that절에서 조동사 can/may 사용. 수능 빈칸·어법 빈출 구조." },
        { name: "관계대명사 목적격 생략", ex: "the solution-based policy (that) you've long dreamed of", point: "목적격 관계대명사 생략 가능. 전치사 of의 목적어임을 확인." }
      ]
    },
    {
      en: "You have to be willing to alter your idea and let others influence its outcome.",
      slash: "You have to be willing / to alter your idea / and let others / influence its outcome.",
      kor: "당신은 기꺼이 해야 한다 / 아이디어를 수정하기를 / 그리고 다른 사람들이 / 그 결과에 영향을 미치도록 해야 한다.",
      grammar: [
        { name: "have to + 동사원형 (의무)", ex: "You have to be willing to alter", point: "have to는 must와 유사하지만 외부적 의무 강조. 수동·능동 구별 주의." },
        { name: "사역동사 let + 목적어 + 원형부정사", ex: "let others influence its outcome", point: "let 뒤 목적격 + 동사원형. to부정사 오답 유형 주의." }
      ]
    },
    {
      en: "You have to be okay with the outcome being a little different, even a little less, than you wanted.",
      slash: "You have to be okay / with the outcome being / a little different, even a little less, / than you wanted.",
      kor: "당신은 괜찮아야 한다 / 결과가 / 조금 다르고, 심지어 조금 부족하더라도 / 당신이 원했던 것보다.",
      grammar: [
        { name: "전치사 with + 동명사 (독립분사구문형)", ex: "with the outcome being a little different", point: "with + 명사 + 분사(현재/과거) 구조. 수능 어법 문제 핵심 출제 포인트." }
      ]
    },
    {
      en: "Say you're pushing for a clean water act.",
      slash: "Say / you're pushing / for a clean water act.",
      kor: "예를 들어 / 당신이 추진하고 있다고 치자 / 깨끗한 물 관련 법안을.",
      grammar: [
        { name: "명령문 Say = Suppose/Imagine (가정의 명령문)", ex: "Say you're pushing for a clean water act", point: "Say가 '~라고 가정하자'의 의미로 쓰이는 구문. 조건절 대용." }
      ]
    },
    {
      en: "Even if what emerges isn't as well-funded as you wished, or doesn't match how you originally conceived the bill, you'll have still succeeded in ensuring that kids in troubled areas have access to clean water.",
      slash: "Even if what emerges / isn't as well-funded / as you wished, / or doesn't match / how you originally conceived the bill, / you'll have still succeeded / in ensuring / that kids in troubled areas / have access to clean water.",
      kor: "비록 나오는 것이 / 충분한 자금을 받지 못하더라도 / 당신이 바랐던 것만큼, / 또는 맞지 않더라도 / 당신이 처음에 법안을 구상했던 방식과, / 당신은 여전히 성공했을 것이다 / 보장하는 데 / 어려운 지역의 아이들이 / 깨끗한 물에 접근할 수 있도록.",
      grammar: [
        { name: "양보 부사절 Even if", ex: "Even if what emerges isn't as well-funded as you wished", point: "even if(가정적 양보) vs. even though(사실적 양보) 구별 빈출." },
        { name: "미래완료 will have + p.p.", ex: "you'll have still succeeded", point: "미래완료는 미래의 특정 시점까지 완료될 일을 표현. 수능 시제 문제 출제." }
      ]
    },
    {
      en: "That's what counts, that they will be safer because of your idea and your effort.",
      slash: "That's what counts, / that they will be safer / because of your idea / and your effort.",
      kor: "그것이 중요한 것이다, / 그들이 더 안전해질 것이라는 것, / 당신의 아이디어 때문에 / 그리고 당신의 노력 때문에.",
      grammar: [
        { name: "관계대명사 what (선행사 포함)", ex: "That's what counts", point: "what = the thing that. 주어·보어·목적어 자리 분석 필수. 수능 어법 최빈출." }
      ]
    },
    {
      en: "Is it perfect?",
      slash: "Is it perfect?",
      kor: "그것이 완벽한가?",
      grammar: [
        { name: "수사의문문 (Rhetorical Question)", ex: "Is it perfect? / No.", point: "수사적 질문으로 실제 대답이 아닌 강조·전환 효과. 글의 흐름 문제 출제." }
      ]
    },
    {
      en: "No.",
      slash: "No.",
      kor: "아니다.",
      grammar: [
        { name: "단답형 응답 / 생략 구조", ex: "No. (It is not perfect.)", point: "반복 어구 생략. 글쓰기의 응집성 관련 출제 가능." }
      ]
    },
    {
      en: "Is there more work to be done?",
      slash: "Is there / more work / to be done?",
      kor: "더 해야 할 일이 있는가?",
      grammar: [
        { name: "to부정사의 형용사적 용법 (수동의 의미)", ex: "work to be done (= work that needs to be done)", point: "to be + p.p.는 수동의 의미 포함. 어법 문제에서 능동/수동 혼동 주의." }
      ]
    },
    {
      en: "Absolutely.",
      slash: "Absolutely.",
      kor: "물론이다.",
      grammar: [
        { name: "단독 부사 문장 / 생략 구조", ex: "Absolutely. (= There is absolutely more work to be done.)", point: "생략에 의한 단문 표현. 글의 일관성·응집성 문제 관련." }
      ]
    },
    {
      en: "But in almost every case, helping move the needle forward is vastly better than not helping at all.",
      slash: "But in almost every case, / helping move the needle forward / is vastly better / than not helping at all.",

function showPassage(idx) {
  currentPassage = idx;
  document.querySelectorAll('.passage-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  renderPassage(idx);
}

function renderPassage(idx) {
  const p = passages[idx];
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="passage-header">
      <div>
        <div class="qno">${p.qnum}</div>
        <h2>${p.title}</h2>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab(${idx},'full')">① 전문</button>
      <button class="tab-btn" onclick="showTab(${idx},'sent')">② 문장분석</button>
      <button class="tab-btn" onclick="showTab(${idx},'vocab')">③ 핵심단어</button>
      <button class="tab-btn" onclick="showTab(${idx},'trans')">④ 전문해석</button>
      <button class="tab-btn" onclick="showTab(${idx},'topic')">⑤ 주제·요지</button>
      <button class="tab-btn" onclick="showTab(${idx},'quiz')">⑥ 변형문제</button>
      <button class="tab-btn" onclick="showTab(${idx},'ans')">⑦ 정답지</button>
    </div>
    <div id="tab-full-${idx}" class="tab-panel active">${renderFull(p)}</div>
    <div id="tab-sent-${idx}" class="tab-panel">${renderSent(p)}</div>
    <div id="tab-vocab-${idx}" class="tab-panel">${renderVocab(p)}</div>
    <div id="tab-trans-${idx}" class="tab-panel">${renderTrans(p)}</div>
    <div id="tab-topic-${idx}" class="tab-panel">${renderTopic(p)}</div>
    <div id="tab-quiz-${idx}" class="tab-panel">${renderQuiz(p, idx)}</div>
    <div id="tab-ans-${idx}" class="tab-panel">${renderAns(p, idx)}</div>
  `;
}

function showTab(idx, name) {
  const tabs = ['full','sent','vocab','trans','topic','quiz','ans'];
  tabs.forEach((t,i) => {
    const panel = document.getElementById(`tab-${t}-${idx}`);
    const btn = document.querySelectorAll('.tab-btn')[i];
    if(panel) panel.classList.toggle('active', t===name);
    if(btn) btn.classList.toggle('active', t===name);
  });
}

function renderFull(p) {
  const circled = ['❶','❷','❸','❹','❺','❻','❼','❽','❾','❿','⓫','⓬'];
  const lines = p.sentences.map((s,i) => `${circled[i]||('('+(i+1)+')')} ${s.en}`).join(' ');
  return `<div class="section-card"><h3>전문 (Full Passage)</h3><div class="full-passage">${lines}</div></div>`;
}

function renderSent(p) {
  const circled = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];
  return `<div class="section-card"><h3>문장분석</h3>` +
    p.sentences.map((s,i) => `
      <div class="sentence-block">
        <span class="sent-num">${circled[i]||i+1}</span>
        <div class="eng-box">${s.en}</div>
        <div class="slash-reading">${s.slash}<span class="kor">${s.kor}</span></div>
        ${s.grammar.map(g => `<div class="grammar-item"><span class="g-name">◆ ${g.name}</span><br><span class="g-ex">▶ ${g.ex}</span><br><span class="g-point">★ ${g.point}</span></div>`).join('')}
      </div>`).join('') + `</div>`;
}

function renderVocab(p) {
  return `<div class="section-card"><h3>핵심단어 및 표현</h3>` +
    p.vocab.map(v => `<div class="vocab-item"><span class="vword">${v.word}</span><span class="vmeta">${v.meaning} | ${v.pos}</span>${v.deriv && v.deriv!=='—' ? `<span class="vderiv">| 파생어: ${v.deriv}</span>` : ''}</div>`).join('') +
    `</div>`;
}

function renderTrans(p) {
  return `<div class="section-card"><h3>전문해석</h3><div class="translation-box">${p.translation}</div></div>`;
}

function renderTopic(p) {
  return `<div class="section-card"><h3>주제 · 요지 · 구조</h3>
    <div class="topic-box"><h4>주제</h4><p>${p.topic.subject}</p></div>
    <div class="topic-box"><h4>요지</h4><p>${p.topic.gist}</p></div>
    <div class="topic-box"><h4>구조 흐름</h4>${p.topic.flow.map(f=>`<div class="flow-step"><span class="flow-badge">${f.step}</span><span>${f.desc}</span></div>`).join('')}</div>
  </div>`;
}

function renderQuiz(p, idx) {
  if(!quizState[idx]) quizState[idx] = {};
  let html = `<div class="section-card"><h3>변형문제 (인터랙티브 퀴즈)</h3>`;

  p.quiz.forEach((q, qi) => {
    const state = quizState[idx][qi] || {};
    html += `<div class="quiz-item" id="quiz-${idx}-${qi}">
      <h4>[${qi+1}번] ${q.type}</h4>
      <div class="quiz-q">${q.qtext.replace(/\n/g,'<br>')}</div>
      <div class="options">`;
    q.options.forEach((opt, oi) => {
      let cls = '';
      if(state.answered) {
        if(oi === q.answer) cls = 'correct';
        else if(oi === state.selected && oi !== q.answer) cls = 'wrong';
      }
      html += `<button class="opt-btn ${cls}" ${state.answered?'disabled':''} onclick="selectOpt(${idx},${qi},${oi})">${opt}</button>`;
    });
    html += `</div>
      <div class="quiz-feedback ${state.answered?(state.selected===q.answer?'ok show':'no show'):''}" id="fb-${idx}-${qi}">
        ${state.answered ? (state.selected===q.answer ? `✓ 정답입니다! ${q.explanation}` : `✗ 오답. 정답은 ${q.options[q.answer]}. ${q.explanation}`) : ''}
      </div>
      <button class="reset-btn" onclick="resetQuiz(${idx},${qi})">↺ 다시 풀기</button>
    </div>`;
  });

  // 서술형
  html += `<h3 style="color:var(--navy);font-size:15px;font-weight:700;margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold);">서술형 문제</h3>`;
  p.shortAnswer.forEach((sa, si) => {
    html += `<div class="short-answer-item">
      <h4>${sa.q.split('\n')[0]}</h4>
      <div class="quiz-q">${sa.q.split('\n').slice(1).join('<br>')}</div>
      <div class="condition-box">${sa.condition}</div>
      <textarea class="answer-textarea" placeholder="답안을 여기에 작성하세요..."></textarea>
      <br><button class="show-answer-btn" onclick="toggleAnswer(this)">모범답안 보기</button>
      <div class="model-answer">📝 모범답안: ${sa.answer}</div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function selectOpt(pidx, qidx, optIdx) {
  if(!quizState[pidx]) quizState[pidx] = {};
  quizState[pidx][qidx] = { answered: true, selected: optIdx };
  const p = passages[pidx];
  const q = p.quiz[qidx];
  const container = document.getElementById(`quiz-${pidx}-${qidx}`);
  const btns = container.querySelectorAll('.opt-btn');
  btns.forEach((b, oi) => {
    b.disabled = true;
    if(oi === q.answer) b.classList.add('correct');
    else if(oi === optIdx && oi !== q.answer) b.classList.add('wrong');
  });
  const fb = document.getElementById(`fb-${pidx}-${qidx}`);
  const correct = optIdx === q.answer;
  fb.className = `quiz-feedback ${correct?'ok':'no'} show`;
  fb.innerHTML = correct ? `✓ 정답입니다! ${q.explanation}` : `✗ 오답. 정답은 ${q.options[q.answer]}. ${q.explanation}`;
}

function resetQuiz(pidx, qidx) {
  if(quizState[pidx]) delete quizState[pidx][qidx];
  showTab(pidx, 'quiz');
  // re-render quiz tab
  const p = passages[pidx];
  document.getElementById(`tab-quiz-${pidx}`).innerHTML = renderQuiz(p, pidx);
}

function toggleAnswer(btn) {
  const ma = btn.nextElementSibling;
  ma.classList.toggle('show');
  btn.textContent = ma.classList.contains('show') ? '모범답안 숨기기' : '모범답안 보기';
}

function renderAns(p, idx) {
  let html = `<div class="section-card"><h3>정답 및 해설</h3>
    <div class="answer-key"><h4>⑥ 변형문제 정답</h4>`;
  p.quiz.forEach((q, qi) => {
    html += `<div class="ans-row">
      <div class="ans-no">${qi+1}</div>
      <div class="ans-content">
        <div class="ans-correct">[${q.type}] 정답: ${q.options[q.answer]}</div>
        <div class="ans-exp">${q.explanation}</div>
      </div>
    </div>`;
  });
  html += `</div>
    <div class="answer-key" style="margin-top:16px"><h4>⑦ 서술형 모범답안</h4>`;
  p.shortAnswer.forEach((sa, si) => {
    html += `<div class="ans-row">
      <div class="ans-no">${si+1}</div>
      <div class="ans-content">
        <div class="ans-correct">${sa.q.split('\n')[0]}</div>
        <div class="ans-exp">📝 ${sa.answer}</div>
      </div>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

// Init
showPassage(0);
</script>
</body>
</html>
